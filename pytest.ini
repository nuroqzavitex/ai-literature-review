[pytest]
testpaths = tests
asyncio_mode = auto
markers =
    gold: gold-set evaluation tests (require frozen fixtures and adjudicated labels)
    v2_4: optional selective full-text tests (V2.4 gate, not in Core suite)
    external: live-provider smoke tests (network, not in deterministic PR suite)
    browser: browser E2E tests requiring a running frontend
filterwarnings =
    ignore::DeprecationWarning
