name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-ci:
    name: Backend Lint & Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with ruff
        run: |
          ruff check src/ tests/
          ruff format --check src/ tests/

      - name: Run tests with coverage
        run: pytest tests/ -v --tb=short --cov=src --cov-fail-under=60
        env:
          APP_ENV: test
          OPENAI_API_KEY: test-key

  frontend-ci:
    name: Frontend Check & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck and lint
        working-directory: frontend
        run: npm run check

      - name: Build Next.js application
        working-directory: frontend
        run: npm run build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY || 'pk_test_ZnVsbC1sZWVjaC01MS5jbGVyay5hY2NvdW50cy5kZXYk' }}
          NEXT_PUBLIC_API_BASE_URL: /api/v1

  sandbox-ci:
    name: Sandbox Service & Runtime Matrix
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: research_sandbox_test
          POSTGRES_USER: sandbox_test
          POSTGRES_PASSWORD: sandbox_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sandbox_test -d research_sandbox_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Sandbox dependencies
        run: |
          pip install -r src/research_sandbox_service/requirements.control.lock
          pip install pytest pytest-asyncio
          pip install --no-deps -e ./src/research_sandbox_service

      - name: Build hardened runtime image
        run: docker build -t research-sandbox-runtime:test src/research_sandbox_service/sandbox_runtime

      - name: Run complete Sandbox suite
        run: pytest src/research_sandbox_service/tests/ -q
        env:
          PYTHONPATH: src/research_sandbox_service:src/research_sandbox_service/sandbox_runtime
          SANDBOX_TEST_POSTGRES_URL: postgresql+psycopg://sandbox_test:sandbox_test@127.0.0.1:5432/research_sandbox_test
          RUN_DOCKER_SANDBOX_TESTS: "1"
          SANDBOX_RUNTIME_SMOKE_IMAGE: research-sandbox-runtime:test

  docker-build-check:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Backend Dockerfile
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: backend:test

      - name: Validate Frontend Dockerfile
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          target: runner
          push: false
          tags: frontend:test
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=/api/v1
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY || 'pk_test_ZnVsbC1sZWVjaC01MS5jbGVyay5hY2NvdW50cy5kZXYk' }}

  sandbox-frontend-e2e:
    name: Sandbox Frontend E2E
    runs-on: ubuntu-latest
    env:
      CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      E2E_CLERK_USER_EMAIL: ${{ secrets.E2E_CLERK_USER_EMAIL }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Check Clerk credentials
        id: check-creds
        run: |
          if [ -z "${{ secrets.CLERK_SECRET_KEY }}" ] || [ -z "${{ secrets.E2E_CLERK_USER_EMAIL }}" ]; then
            echo "has_creds=false" >> $GITHUB_OUTPUT
            echo "::notice ::Clerk E2E secrets not configured. Skipping E2E tests."
          else
            echo "has_creds=true" >> $GITHUB_OUTPUT
          fi

      - name: Set up Node.js
        if: steps.check-creds.outputs.has_creds == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        if: steps.check-creds.outputs.has_creds == 'true'
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Chromium
        if: steps.check-creds.outputs.has_creds == 'true'
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Sandbox E2E and mobile accessibility gate
        if: steps.check-creds.outputs.has_creds == 'true'
        working-directory: frontend
        run: npm run test:e2e
