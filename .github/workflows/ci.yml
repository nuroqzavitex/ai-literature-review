name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint with ruff
        run: |
          ruff check src/ tests/
          ruff format --check src/ tests/

      - name: Run tests
        run: pytest tests/ -v --tb=short --cov=src --cov-fail-under=60
        env:
          APP_ENV: test
          OPENAI_API_KEY: test-key

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Frontend checks
        run: |
          cd frontend
          npm ci
          npm run check
          npm run build

  sandbox-postgres-and-runtime:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: research_sandbox_test
          POSTGRES_USER: sandbox_test
          POSTGRES_PASSWORD: sandbox_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sandbox_test -d research_sandbox_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Sandbox dependencies
        run: pip install -e ./research-sandbox pytest pytest-asyncio

      - name: Build hardened runtime image
        run: docker build -t research-sandbox-runtime:test research-sandbox/sandbox_runtime

      - name: Run complete Sandbox suite without opt-in skips
        run: pytest research-sandbox/tests/ -q
        env:
          SANDBOX_TEST_POSTGRES_URL: postgresql+psycopg://sandbox_test:sandbox_test@127.0.0.1:5432/research_sandbox_test
          RUN_DOCKER_SANDBOX_TESTS: "1"
          SANDBOX_RUNTIME_SMOKE_IMAGE: research-sandbox-runtime:test

  sandbox-frontend-e2e:
    runs-on: ubuntu-latest
    env:
      CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      E2E_CLERK_USER_EMAIL: ${{ secrets.E2E_CLERK_USER_EMAIL }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Explain missing Clerk E2E credentials
        if: env.CLERK_SECRET_KEY == '' || env.E2E_CLERK_USER_EMAIL == ''
        run: |
          echo "Clerk E2E is not configured. Add CLERK_PUBLISHABLE_KEY, CLERK_SECRET_KEY and E2E_CLERK_USER_EMAIL repository secrets."
          exit 1

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run three Sandbox flows and mobile accessibility gate
        working-directory: frontend
        run: npm run test:e2e
